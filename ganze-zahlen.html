<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernpfad Ganze Zahlen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Gleiche Familie wie der Terme-Lernpfad: Papier, Tinte, Petrol (Bedienung), Bernstein (Hervorhebung).
   Dazu ein festes Farbpaar für Vorzeichen: Blau = positiv, Himbeere = negativ. */
:root {
  --bg: #f4f1ea; --dot: rgba(90, 75, 40, .13); --card: #fffdf9; --card-2: #f6f2e9;
  --ink: #1e2430; --ink-2: #5b606c; --ink-3: #8c909a; --line: #e6dfd1; --line-2: #cbc1ae;
  --pri: #0e6b6b; --pri-ink: #ffffff; --pri-soft: #dcefeb;
  --red: #d1382c; --hop: #ffc02e; --hop-ink: #2e2200; --hop-soft: #fff0c2; --hop-strong: #a86a00;
  --ok: #1b7a45; --ok-soft: #e0f3e6; --warn: #a3560a; --warn-soft: #fff1de;
  --pos: #2c5fc0; --pos-soft: #e1e9fb; --neg: #c22f5f; --neg-soft: #fbe3ec;
  --k1: #0e6b6b; --k1s: #dcefeb; --k2: #a86a00; --k2s: #fff0c2; --k3: #6a4bc4; --k3s: #ece6fb;
  --shadow: 0 1px 2px rgba(40, 32, 15, .05), 0 8px 24px rgba(40, 32, 15, .06);
  --f: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --ease: cubic-bezier(.5, 0, .25, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161d1c; --dot: rgba(220, 235, 225, .07); --card: #1e2826; --card-2: #25302e;
    --ink: #edf2ee; --ink-2: #b3c0ba; --ink-3: #82918b; --line: #34433f; --line-2: #4f625c;
    --pri: #5cc6bc; --pri-ink: #0a1d1b; --pri-soft: #1f3b38; --red: #ff7b6b;
    --hop: #f2b62c; --hop-ink: #1d1600; --hop-soft: rgba(242, 182, 44, .17); --hop-strong: #ffcb55;
    --ok: #6fd69a; --ok-soft: #1b3326; --warn: #ffbf6e; --warn-soft: #3a2d18;
    --pos: #8fb2ff; --pos-soft: rgba(143, 178, 255, .16); --neg: #ff8fb8; --neg-soft: rgba(255, 143, 184, .15);
    --k1: #5cc6bc; --k1s: #1f3b38; --k2: #ffcb55; --k2s: rgba(242, 182, 44, .17); --k3: #b9a4ff; --k3s: rgba(185, 164, 255, .16);
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161d1c; --dot: rgba(220, 235, 225, .07); --card: #1e2826; --card-2: #25302e;
  --ink: #edf2ee; --ink-2: #b3c0ba; --ink-3: #82918b; --line: #34433f; --line-2: #4f625c;
  --pri: #5cc6bc; --pri-ink: #0a1d1b; --pri-soft: #1f3b38; --red: #ff7b6b;
  --hop: #f2b62c; --hop-ink: #1d1600; --hop-soft: rgba(242, 182, 44, .17); --hop-strong: #ffcb55;
  --ok: #6fd69a; --ok-soft: #1b3326; --warn: #ffbf6e; --warn-soft: #3a2d18;
  --pos: #8fb2ff; --pos-soft: rgba(143, 178, 255, .16); --neg: #ff8fb8; --neg-soft: rgba(255, 143, 184, .15);
  --k1: #5cc6bc; --k1s: #1f3b38; --k2: #ffcb55; --k2s: rgba(242, 182, 44, .17); --k3: #b9a4ff; --k3s: rgba(185, 164, 255, .16);
  --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .2);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.4px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 16px/1.5 var(--f);
}
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: clamp(1.25rem, 3vw, 1.6rem); }
h2 { font-size: clamp(1.3rem, 3.4vw, 1.75rem); }
h3 { font-size: 1.12rem; margin-bottom: 10px; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 0; padding-left: 1.25em; display: grid; gap: 6px; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; }
[hidden] { display: none !important; }
sup { font-size: .62em; vertical-align: .75em; line-height: 0; margin-left: .03em; font-weight: 700; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .8em; line-height: 1.15; margin: 0 .08em; }
.fr > span { padding: 0 .2em; }
.fr > span + span { border-top: 1.5px solid currentColor; }

.k1 { --kb: var(--k1); --ks: var(--k1s); } .k2 { --kb: var(--k2); --ks: var(--k2s); } .k3 { --kb: var(--k3); --ks: var(--k3s); }
.pos { --kb: var(--pos); --ks: var(--pos-soft); } .neg { --kb: var(--neg); --ks: var(--neg-soft); }
.nv { color: var(--neg); } .pv { color: var(--pos); }
.hl { background: var(--hop); color: var(--hop-ink); border-radius: 6px; padding: 0 .18em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.box { display: inline-block; width: 1.05em; height: 1.1em; border: 2.5px dashed var(--ink-3); border-radius: 7px; vertical-align: -.15em; margin: 0 .15em; }

/* ---------- Kopf ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo {
  width: 46px; height: 46px; flex: none; border-radius: 13px; background: var(--pri); color: var(--pri-ink);
  display: flex; align-items: center; justify-content: center; font: 700 19px/1 var(--f); letter-spacing: -.02em;
}
.logo i { font-style: normal; color: var(--hop); }

.seg { display: inline-flex; gap: 3px; padding: 3px; background: var(--card-2); border: 1px solid var(--line); border-radius: 13px; }
.seg button, .seg a {
  border: 0; background: transparent; cursor: pointer; font-weight: 600; color: var(--ink-2); text-decoration: none;
  padding: 7px 16px; min-height: 42px; border-radius: 10px; line-height: 1.15;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
}
.seg button small { font-weight: 400; font-size: .74rem; opacity: .85; }
.seg button:hover, .seg a:hover { background: var(--pri-soft); color: var(--ink); }
.seg button[aria-pressed="true"], .seg a[aria-current="page"] { background: var(--pri); color: var(--pri-ink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
  border: 1.5px solid var(--line-2); background: var(--card); color: var(--ink); font-weight: 600;
}
.btn:hover { border-color: var(--pri); }
.btn.primary { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .4; cursor: default; filter: none; border-color: var(--line-2); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.icon { padding: 8px 11px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 22px; min-width: 0; }
.view { display: grid; gap: 16px; }
.view > * { min-width: 0; }
.lbl { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 0; }

/* ---------- Lernpfad (Startseite) ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px 28px; align-items: center; }
.hero p { max-width: 62ch; color: var(--ink-2); }
.hero h2 { margin: 4px 0 10px; }
.herofx { display: grid; gap: 8px; justify-items: center; padding: 14px; border-radius: 14px; background: var(--card-2); border: 1px dashed var(--line-2); min-width: 0; overflow: hidden; }
.herofx .eqbig { font-size: 1.3rem; margin: 0; }
.herofx .lbl { justify-self: start; }
.herofx .nl { min-width: 0; }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; position: relative; }
.path::before { content: ""; position: absolute; left: 33px; top: 26px; bottom: 26px; border-left: 3px dashed var(--line-2); }
.stn {
  position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; align-items: center; gap: 6px 16px;
  padding: 12px 16px 12px 12px; text-decoration: none; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  transition: border-color .2s, transform .2s;
}
.stn:hover { border-color: var(--pri); transform: translateX(3px); }
.num {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.1rem;
  background: var(--card); border: 3px solid var(--pri); color: var(--pri); position: relative; z-index: 1; flex: none;
}
.stn.done .num { background: var(--pri); color: var(--pri-ink); }
.stn.goal .num { border-color: var(--hop-strong); color: var(--hop-strong); }
.st-t { display: grid; min-width: 0; }
.st-t b { font-size: 1.05rem; }
.st-t small { color: var(--ink-2); font-size: .86rem; }
.st-ex { font-weight: 600; color: var(--ink-2); white-space: nowrap; font-size: .98rem; }
.st-ex small { font-weight: 500; }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 20px; height: 20px; }
.stars .on { fill: var(--hop); stroke: var(--hop-strong); }
.stars .off { fill: none; stroke: var(--line-2); }

/* ---------- Station ---------- */
.shead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px; }
.stitle { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.intro p, .intro li { max-width: 68ch; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.merke { background: var(--pri-soft); border-color: var(--pri); }
.falle { background: var(--warn-soft); border-color: var(--warn); }
.merke h3 { color: var(--pri); }
.falle h3 { color: var(--warn); }
.nextrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; }
.figwrap { overflow-x: auto; margin: 6px 0 12px; padding: 8px 0; }
.figwrap .nl { margin-top: -54px; }

.dictwrap { overflow-x: auto; margin: 4px 0 10px; }
.dict { border-collapse: collapse; width: 100%; min-width: 440px; font-size: .95rem; }
.dict th { text-align: left; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 6px 10px; border-bottom: 2px solid var(--line); }
.dict td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dict td.z { font-weight: 700; font-size: 1.25rem; color: var(--pri); text-align: center; }
.dict td:last-child { white-space: nowrap; font-weight: 600; }

/* Vorzeichen-Regeln */
.vz { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 460px; width: 100%; margin: 6px 0 10px; }
.vz > span { padding: 8px 10px; border-radius: 10px; background: var(--card); border: 1.5px solid var(--line); font-weight: 600; text-align: center; white-space: nowrap; font-size: 1.05rem; }
.vz > span.p { border-color: var(--pos); } .vz > span.n { border-color: var(--neg); }
.vz > span.on { background: var(--hop-soft); border-color: var(--hop-strong); }
.vz b { font-size: 1.15em; }
.ladder { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 12px; }
.ladder span { padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--line-2); font-weight: 600; }
.ladder i { font-style: normal; color: var(--ink-3); font-weight: 700; }

/* ---------- Zahlengerade (SVG) ---------- */
.nl { display: block; width: 100%; min-width: 480px; max-width: 760px; height: auto; margin: 0 auto; }
.nl text { font: 600 18px var(--f); fill: var(--ink); }
.nl text.nl-l { fill: var(--ink-2); font-weight: 500; font-size: 17px; }
.nl text.nl-l.n { fill: var(--neg); }
.nl text.nl-l.z { fill: var(--ink); font-weight: 700; }
.nl-ax { stroke: var(--ink); stroke-width: 2.5; }
.nl-ah { fill: var(--ink); }
.nl-t { stroke: var(--ink-2); stroke-width: 1.6; }
.nl-t.z { stroke: var(--ink); stroke-width: 3; }
.nl-nz { fill: var(--neg-soft); } .nl-pz { fill: var(--pos-soft); }
.nl .pos { --c: var(--pos); } .nl .neg { --c: var(--neg); } .nl .hop { --c: var(--hop-strong); } .nl .ink { --c: var(--ink); }
.nl-j { fill: none; stroke: var(--c, var(--ink)); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 1; }
.nl-jh { fill: var(--c, var(--ink)); }
.nl text.nl-jl { fill: var(--c, var(--ink)); font-size: 17px; }
.nl-sp { fill: none; stroke: var(--c, var(--ink-2)); stroke-width: 2.4; }
.nl text.nl-sl { fill: var(--c, var(--ink-2)); font-size: 17px; }
.nl-p circle { fill: var(--c, var(--hop)); stroke: var(--card); stroke-width: 3; }
.nl text.nl-pl { fill: var(--c, var(--ink)); font-size: 20px; font-weight: 700; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
.nl-j.new { animation: draw .6s var(--ease); }
.nl .new-h { animation: pop .25s .5s backwards; }

/* ---------- Erklär-Bühne ---------- */
.exhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip {
  border: 1.5px solid var(--line-2); background: var(--card); border-radius: 999px; cursor: pointer;
  padding: 4px 13px; min-height: 38px; color: var(--ink); font-weight: 500;
}
.chip:hover { border-color: var(--pri); }
.chip[aria-pressed="true"] { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.stagebox {
  margin-top: 16px; min-height: 240px; padding: 18px 10px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line);
  display: grid; align-content: center; justify-items: center; gap: 14px; overflow-x: auto; overflow-y: hidden;
}
.stagebox > * { max-width: 100%; }
.stagebox > .nl { max-width: 760px; }
.cap { margin: 14px 0 0; min-height: 3em; font-size: 1.02rem; max-width: 72ch; }
.cap b { background: var(--hop); color: var(--hop-ink); padding: 0 6px; border-radius: 6px; }
.player { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; margin-top: 14px; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; min-width: 0; }
.cv {
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink-3); cursor: pointer;
  border-radius: 10px; padding: 3px 10px; min-height: 36px; font-weight: 600; white-space: nowrap; font-size: .9rem;
}
.cv.past { color: var(--ink-2); }
.cv[aria-current="step"] { color: var(--ink); border-color: var(--pri); background: var(--pri-soft); }
.ar { color: var(--ink-3); font-weight: 600; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.eqbig { font: 600 clamp(1.45rem, 4.6vw, 2.05rem)/1.35 var(--f); text-align: center; margin: 0; }
.eqbig.sm { font-size: clamp(1.2rem, 3.8vw, 1.6rem); }
.eqbig.dim { color: var(--ink-3); }
.run { margin: 0; font-weight: 600; font-size: clamp(1.05rem, 3.2vw, 1.3rem); text-align: center; color: var(--ink-2); }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.op { font-weight: 700; color: var(--ink-3); font-size: 1.2rem; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: 100%; max-width: 680px; }
.duo > div { display: grid; gap: 8px; justify-items: center; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }

.phrase { font-size: clamp(1.05rem, 3.2vw, 1.3rem); line-height: 2; text-align: center; margin: 0; max-width: 46ch; }
.phrase .sg { border-radius: 6px; padding: 2px 3px; transition: background-color .3s, box-shadow .3s; }
.phrase .sg.on { background: var(--ks); box-shadow: inset 0 -3px 0 var(--kb); }

/* Kärtchen und Gruppen */
.fc {
  display: inline-block; vertical-align: middle; text-align: center; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 10px; position: relative;
  border: 2px solid var(--kb, var(--line-2)); background: var(--ks, var(--card)); font: 600 1.25rem/40px var(--f); white-space: nowrap;
}
.fc.big { height: 54px; line-height: 50px; padding: 0 14px; font-size: 1.45rem; }
.fc::after {
  content: ""; position: absolute; left: -6%; right: -6%; top: 50%; height: 3px; border-radius: 2px; background: var(--red);
  transform: rotate(-35deg) scaleX(0); transition: transform .45s var(--ease);
}
.fc.cut { opacity: .55; }
.fc.cut::after { transform: rotate(-35deg) scaleX(1); }
.grp { display: inline-grid; justify-items: center; gap: 8px; padding: 10px; border: 2px dashed var(--kb, var(--line-2)); border-radius: 14px; }
.gl { font-size: .88rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.pair { display: inline-grid; justify-items: center; gap: 6px; padding: 8px; border: 2px dashed var(--pos); border-radius: 14px; }
.pair .gl { color: var(--pos); }

/* Plättchen */
.pls { display: grid; gap: 10px; justify-items: start; }
.plrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.plrow .gl { min-width: 4.2em; text-align: right; margin-right: 6px; font-size: 1rem; }
.pl {
  width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; position: relative;
  font: 700 1.2rem/1 var(--f); color: var(--card); background: var(--kb);
}
.pl.cut { opacity: .4; }
.pl.cut::after { content: ""; position: absolute; left: -5px; right: -5px; top: 50%; height: 3px; margin-top: -1.5px; background: var(--ink); border-radius: 2px; transform: rotate(-35deg); }

/* Muster-Tabelle */
.mt { border-collapse: collapse; font-weight: 600; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.mt td { padding: 4px 10px; text-align: right; }
.mt td.d { color: var(--ink-3); font-size: .85rem; font-weight: 500; text-align: left; }
.mt tr.new td { background: var(--hop-soft); }
.mt tr.new td:first-child { border-radius: 8px 0 0 8px; }
.mt tr.new td:last-child { border-radius: 0 8px 8px 0; }

/* Schrittweise rechnen */
.calc { display: grid; gap: 6px; justify-items: start; }
.calc .ln { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font: 600 clamp(1.25rem, 4vw, 1.7rem)/1.3 var(--f); color: var(--ink-3); }
.calc .ln.now { color: var(--ink); }
.calc .lc { font-size: .8rem; font-weight: 500; color: var(--ink-3); }

/* Lösungswege */
.lines { display: grid; gap: 8px; }
.ln { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.lm { font-weight: 600; font-size: 1.22rem; }
.lc { font-size: .85rem; color: var(--ink-2); }
.lines .nl { max-width: 560px; margin: 0; }
.lines .ln:has(.nl) { display: block; overflow-x: auto; }
.bsp { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.wk { padding: 14px 16px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); display: grid; gap: 10px; align-content: start; min-width: 0; }
.wq { margin: 0; font-size: .85rem; color: var(--ink-2); font-weight: 500; }
.wk .lines { overflow-x: auto; }

/* ---------- Üben ---------- */
.ptop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; }
.pstat { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.score { font-weight: 600; color: var(--ink-2); display: flex; align-items: baseline; gap: 6px; }
.task { display: grid; gap: 16px; }
.tq { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.tag { font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--pri-soft); color: var(--pri); }
.qline { font: 600 clamp(1.5rem, 5vw, 2.1rem)/1.3 var(--f); margin: 0; overflow-x: auto; }
.qline.text { font-size: clamp(1.1rem, 3.4vw, 1.35rem); font-weight: 500; max-width: 60ch; }

function rng(vals, minSpan = 14) {

function check(task, input) {

    const o = task.opts[input];

  }
  if (task.kind === 'list') {
    const it = splitList(input);
    if (!it.length) return { ok: false, syntax: true, msg: 'Gib zuerst die Zahlen ein.' };
    const bad = it.find(x => !/^[+-]?\d+$/.test(x));
    if (bad) return { ok: false, syntax: true, msg: `„${bad}“ kann ich nicht lesen. Trenne die Zahlen mit Strichpunkt, zum Beispiel −5; −2; 0; 3.` };
    const got = it.map(Number), want = task.vals;
    if (got.length !== want.length) return { ok: false, syntax: true, msg: `Es sind ${want.length} Zahlen. Du hast ${got.length} eingegeben.` };
    const same = [...got].sort((a, b) => a - b).every((x, i) => x === want[i]);
    if (!same) return { ok: false, msg: 'Da stimmt eine Zahl nicht mit der Aufgabe überein. Schreib alle Zahlen genau ab, mit Vorzeichen.' };
    if (got.every((x, i) => x === want[i])) return { ok: true };
    if (got.every((x, i) => x === want[want.length - 1 - i])) return { ok: false, msg: 'Du hast von groß nach klein geordnet. Gefragt ist von klein nach groß.' };
    const neg = want.filter(x => x < 0), gn = got.filter(x => x < 0);
    if (gn.length > 1 && gn.every((x, i) => x === neg[neg.length - 1 - i])) return { ok: false, msg: 'Schau dir die negativen Zahlen noch einmal an: Je größer der Betrag, desto kleiner ist eine negative Zahl. −9 ist kleiner als −2.' };
    return { ok: false, msg: 'Die Reihenfolge stimmt noch nicht. Denk an die Zahlengerade: Je weiter links, desto kleiner.' };
  }
  let ast, c;
  try { ast = parse(input); c = val(ast); }
  catch (e) { if (!e.user) throw e; return { ok: false, syntax: true, msg: e.message }; }
  if (qeq(c, task.val)) {
    const plain = ast.t === 'num' || ((ast.t === 'neg' || ast.t === 'pos') && ast.a.t === 'num');
    return plain ? { ok: true } : { ok: false, near: true, msg: 'Der Wert stimmt, aber rechne noch ganz aus, bis nur eine Zahl dasteht.' };
  }
  for (const t of task.traps || []) if (qeq(c, t.val)) return { ok: false, msg: t.msg };
  if (!qzero(task.val) && qeq(c, qneg(task.val))) return { ok: false, msg: task.signMsg || 'Der Betrag stimmt, aber das Vorzeichen nicht.' };
  return { ok: false, msg: task.wrongMsg || 'Das stimmt noch nicht. Rechne Schritt für Schritt und achte auf die Vorzeichen.' };
}

const KEY = 'gz-v2', OLD = 'gz-v1', POS = 'gz-pos';

}

  const d = store.get(KEY, null);

function morph(el, html) {
  const old = new Map();

  if (anim) el.querySelectorAll('[data-k]').forEach(n => old.set(n.dataset.k, n.getBoundingClientRect()));

}

  </ol>
  <section class="card"><h3>Fortschritt sichern und zurücksetzen</h3>
    <p>Dein Fortschritt wird <b>automatisch in diesem Browser auf diesem Gerät</b> gespeichert, auch wenn du die Datei schließt und später wieder öffnest. Öffne die Datei dafür immer vom selben Ort und im selben Browser. Mit einer Sicherungsdatei kannst du den Stand aufheben oder auf ein anderes Gerät mitnehmen.</p>
    <div class="btns"><button class="btn" type="button" id="h-exp">💾 Fortschritt als Datei sichern</button><label class="btn">📂 Sicherung laden<input type="file" id="h-imp" accept=".json,application/json" hidden></label><button class="btn danger" type="button" id="h-reset">🗑 Gesamten Fortschritt löschen</button></div>
    <p class="goalinfo" id="h-msg" aria-live="polite"></p>
    <p class="goalinfo">Einzelne Stationen setzt du auf ihrer Üben-Seite zurück. Beim Zurücksetzen bekommst du neue Aufgaben mit anderen Zahlen.</p>
  </section>`;
  $('#h-exp').onclick = exportData;
  $('#h-imp').onchange = e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; };
  twoClick($('#h-reset'), '🗑 Gesamten Fortschritt löschen', 'Wirklich alles löschen? Nochmal klicken.', () => {
    store.del(KEY); store.del(POS); for (let i = 1; i <= 11; i++) store.del('gz-lvl-' + i);
    data = loadData(); home(); $('#h-msg').textContent = 'Der gesamte Fortschritt wurde gelöscht.';
  });
}
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'ganze-zahlen-lernpfad', saved: new Date().toISOString(), data, pos: store.get(POS, null) }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Ganze-Zahlen_Fortschritt_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    let j = null; try { j = JSON.parse(r.result); } catch (e) { /* unten */ }
    const msg = $('#h-msg');
    if (!j || j.app !== 'ganze-zahlen-lernpfad' || !j.data || !j.data.st) { msg.textContent = 'Das ist keine gültige Sicherungsdatei des Lernpfads Ganze Zahlen.'; return; }
    const old = j.data.v !== 2; data = migrate(j.data); save(); if (j.pos) store.set(POS, old ? remapPos(j.pos) : j.pos); home();
    $('#h-msg').textContent = 'Sicherung vom ' + new Date(j.saved).toLocaleString('de-DE') + ' geladen.';
  };
  r.readAsText(file);
}

// ---------- Station ----------
function station(id, mode) {
  const s = T.byId(id);
  if (s.mix) mode = 'ueben';
  main.innerHTML = `
  <nav class="shead" aria-label="Station">
    <a class="btn" href="#start">← Lernpfad</a>
    <div class="stitle"><span class="num" aria-hidden="true">${s.mix ? '∑' : id}</span><div><p class="lbl">${s.mix ? 'Zum Schluss' : `Station ${id} von ${T.stations.length}`}</p><h2>${s.title}</h2></div></div>
    ${s.mix ? '' : `<div class="seg"><a href="#s${id}"${mode !== 'ueben' ? ' aria-current="page"' : ''}>1. Verstehen</a><a href="#s${id}-ueben"${mode === 'ueben' ? ' aria-current="page"' : ''}>2. Üben</a></div>`}
  </nav>
  <div id="pane" class="view"></div>`;
  const pane = $('#pane');
  if (mode === 'ueben') practice(s, pane); else learn(s, pane);
}

function learn(s, pane) {
  const c = stats([s.id]);
  pane.innerHTML = `
  <section class="card intro"><h3>Worum geht es?</h3>${s.intro}</section>
  <section class="card" id="ex">
    <div class="exhead"><h3>Schritt für Schritt</h3><span class="lbl">Wähle ein Beispiel</span></div>
    <div class="chips" id="ex-chips"></div>
    <div class="stagebox" id="ex-stage"></div>
    <p class="cap" id="ex-cap" aria-live="polite"></p>
    <div class="player">
      <div class="chain" id="ex-chain"></div>
      <div class="btns"><button class="btn" type="button" id="ex-prev">Zurück</button><button class="btn primary" type="button" id="ex-next">Weiter</button></div>
    </div>
  </section>
  <div class="two"><section class="card merke"><h3>Merke</h3>${s.merke}</section><section class="card falle"><h3>Vorsicht, Falle!</h3>${s.falle}</section></div>
  <section class="card"><h3>Beispiele mit Lösungsweg</h3>
    <div class="bsp">${s.bsp().map(t => `<div class="wk"><p class="wq">${t.prompt}${t.qText ? ': ' + t.q : ''}</p>${T.lineH(t.lines)}</div>`).join('')}</div>
  </section>
  <div class="nextrow"><span class="goalinfo">Übungen dieser Station: ${progLine(c)}</span><a class="btn primary" href="#s${s.id}-ueben">Jetzt üben →</a></div>`;
  explorer(s);
}

function explorer(s) {
  const items = s.examples();
  let cur = 0, step = 0, steps = [];
  const chips = $('#ex-chips'), stage = $('#ex-stage'), cap = $('#ex-cap'), chain = $('#ex-chain');
  const prev = $('#ex-prev'), next = $('#ex-next');
  chips.innerHTML = items.map((it, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="${i === 0}">${it.label}</button>`).join('');
  function draw() {
    morph(stage, steps[step].h);
    cap.innerHTML = steps[step].cap;
    chain.innerHTML = steps.map((x, i) => (i ? '<span class="ar" aria-hidden="true">→</span>' : '')
      + `<button type="button" class="cv${i < step ? ' past' : ''}" data-s="${i}"${i === step ? ' aria-current="step"' : ''}>${x.lab}</button>`).join('');
    prev.disabled = step === 0;
    next.textContent = step === steps.length - 1 ? 'Nochmal' : 'Weiter';
  }
  function load(i) {
    cur = i; steps = s.explore(items[i].x); step = 0; draw();
    chips.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === i)));
  }
  chips.onclick = e => { const b = e.target.closest('[data-i]'); if (b) load(+b.dataset.i); };
  chain.onclick = e => { const b = e.target.closest('[data-s]'); if (b) { step = +b.dataset.s; draw(); } };
  prev.onclick = () => { if (step > 0) { step--; draw(); } };
  next.onclick = () => { step = step === steps.length - 1 ? 0 : step + 1; draw(); };
  load(0);
  TLUI.explorer = { steps: () => steps.length, step: () => step, next: () => next.click(), load, count: items.length };
}

// ---------- Üben ----------
function helpStages(t) {
  const base = T.byId(t.st);
  const st = [base.hint(t), 'Erinnere dich an die Regeln:' + base.merke, 'Achte auf diese typischen Fehler:' + base.falle];
  st.push(t.lines.length >= 3
    ? 'So beginnt der Lösungsweg – rechne ab hier selbst weiter:' + T.lineH(t.lines.slice(0, -1))
    : `Schau dir die <a href="#s${t.st}">Erklärung und die Beispiele mit Lösungsweg</a> dieser Station noch einmal an.`);
  return st.slice(0, MAXW - 1);
}
function practice(s, pane) {
  const counted = !s.mix;
  let cur = counted ? Math.max(0, firstOpen(s.id)) : -1;
  let t, w = 0, status = null, extraLvl = Math.min(3, Math.max(1, +store.get('gz-lvl-' + s.id, 1) || 1));
  pane.innerHTML = `
  ${counted ? `<div class="card ptop">
    <div class="slots" id="p-slots" role="group" aria-label="Aufgaben dieser Station"></div>
    <div class="pstat"><span id="p-stars"></span><span class="score" id="p-score" aria-live="polite"></span></div>
  </div>` : `<div class="card ptop"><div class="seg" id="p-level" role="group" aria-label="Stufe">${LV.map((n, i) => `<button type="button" data-l="${i + 1}" aria-pressed="${extraLvl === i + 1}">${n}<small>${s.lvl[i]}</small></button>`).join('')}</div><p class="goalinfo">Freies Training: Diese Aufgaben zählen nicht zum Fortschritt.</p></div>`}
  <form class="card task" id="p-form" autocomplete="off" novalidate>
    <div class="tq"><p class="lbl" id="p-prompt"></p><span class="tag" id="p-tag" hidden></span><span class="tries" id="p-tries"></span></div>
    <div class="qline" id="p-q"></div>
    <div id="p-ans"></div>
    <div class="actions">
      <button class="btn primary" type="submit" id="p-check">Prüfen</button>
      <button class="btn" type="button" id="p-next">Nächste Aufgabe</button>
      <button class="btn" type="button" id="p-sol" hidden>Lösungsweg</button>
    </div>
    <div class="fb" id="p-fb" aria-live="polite" hidden></div>
    <ul class="hints" id="p-hints"></ul>
    <div class="solbox" id="p-solbox" hidden></div>
  </form>
  <p class="goalinfo">Nach jedem Fehlversuch erscheint ein neuer Tipp. Beim ${MAXW}. Fehlversuch wird die richtige Lösung angezeigt. Eingaben, die ich nicht lesen kann, und fast richtige Ergebnisse (zum Beispiel noch nicht ganz ausgerechnet) zählen nicht als Fehlversuch.</p>
  ${counted ? `<section class="card prog" id="p-prog"></section>` : ''}
  ${s.mix ? '' : `<div class="nextrow"><a class="btn" href="#s${s.id}">← Zur Erklärung</a>${s.id < T.stations.length
    ? `<a class="btn primary" href="#s${s.id + 1}">Nächste Station →</a>`
    : `<a class="btn primary" href="#s${T.mix.id}-ueben">Gemischtes Training →</a>`}</div>`}`;
  const form = $('#p-form'), fb = $('#p-fb'), solbox = $('#p-solbox'), ans = $('#p-ans'), checkBtn = $('#p-check'), hintsEl = $('#p-hints'), solBtn = $('#p-sol');
  let inp = null, prevEl = null, stages = [];

  function paintStats() {
    if (!counted) return;
    const c = stats([s.id]);
    $('#p-slots').innerHTML = LV.map((n, l) => `<span class="slv"><span class="lbl">${n}</span>${[0, 1, 2].map(k => { const i = l * PER + k, x = slot(s.id, i);
      return `<button type="button" class="sl${x.s ? ' ' + x.s : x.w ? ' tried' : ''}${i === cur ? ' cur' : ''}" data-i="${i}" title="${x.s === 'free' ? 'ohne Hilfe gelöst' : x.s === 'hint' ? 'mit Tipps gelöst' : x.s === 'shown' ? 'Lösung angezeigt' : x.w ? x.w + ' Fehlversuch(e)' : 'offen'}">${i + 1}</button>`; }).join('')}</span>`).join('')
      + `<button type="button" class="sl extra${cur < 0 ? ' cur' : ''}" data-i="-1" title="Extra-Aufgabe, zählt nicht">+</button>`;
    $('#p-stars').innerHTML = starsH(s.id);
    $('#p-score').textContent = `${c.done} von ${c.total} bearbeitet`;
    $('#p-prog').innerHTML = `<div class="ptop2"><h3>Station ${s.id}: ${progLine(c)}</h3><button class="btn danger sm" type="button" id="p-reset">Fortschritt dieser Station löschen</button></div>${stackH(c)}${legendH(c)}`;
    twoClick($('#p-reset'), 'Fortschritt dieser Station löschen', 'Wirklich löschen? Nochmal klicken.', () => {
      delete data.st[s.id]; data.off = data.off || {}; data.off[s.id] = (data.off[s.id] || 0) + 1; save();
      cur = 0; openTask();
    });
  }
  function showFb(cls, html) { fb.className = 'fb' + (cls ? ' ' + cls : ''); fb.innerHTML = html; fb.hidden = false; }
  function paintHints() { hintsEl.innerHTML = stages.slice(0, Math.min(w, stages.length)).map((h, i) => `<li><b>Tipp ${i + 1}:</b> ${h}</li>`).join(''); }
  function paintTries() { $('#p-tries').textContent = status || !w ? '' : 'Fehlversuche ' + '●'.repeat(w) + '○'.repeat(MAXW - w); }
  const right = () => (t.kind === 'mc' ? `„${t.opts.find(o => o.ok).h}“` : t.solH);
  const showSolution = () => { solbox.innerHTML = `<p class="lbl">Lösungsweg</p>${T.lineH(t.lines)}<p>Lösung: <b>${right()}</b></p>`; solbox.hidden = false; };
  function keysFor() {
    const d = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '−'];
    return t.kind === 'list' ? d.concat([';', '⌫']) : d.concat(['(', ')', '⌫']);
  }
  function lockInput() { if (inp) inp.disabled = true; ans.querySelectorAll('button').forEach(b => { b.disabled = true; }); }
  function openTask() {
    const st = cur >= 0 ? slot(s.id, cur) : {};
    const fo = firstOpen(s.id);
    t = cur >= 0 ? genSlot(s, cur) : s.gen(counted ? (fo < 0 ? 3 : Math.floor(fo / PER) + 1) : extraLvl);
    w = st.w || 0; status = st.s || null; stages = helpStages(t);
    $('#p-prompt').textContent = (cur >= 0 ? `Aufgabe ${cur + 1} von ${SLOTS} · ${LV[Math.floor(cur / PER)]} · ` : counted ? 'Extra-Aufgabe (zählt nicht) · ' : '') + t.prompt;
    const tag = $('#p-tag'); tag.hidden = !t.tag; tag.textContent = t.tag || '';
    const q = $('#p-q');
    q.className = 'qline' + (t.qText ? ' text' : '');
    q.innerHTML = t.q + (t.after ? `<span class="for">${t.after}</span>` : '');
    fb.hidden = true; solbox.hidden = true; hintsEl.innerHTML = '';
    checkBtn.textContent = 'Prüfen'; checkBtn.hidden = false; checkBtn.disabled = false;
    solBtn.hidden = cur >= 0;
    if (t.kind === 'mc') {
      inp = null; prevEl = null; checkBtn.hidden = true;
      ans.innerHTML = `<div class="opts${t.sym ? ' sym' : ''}" role="group" aria-label="Antworten">${t.opts.map((o, i) => `<button type="button" class="opt" data-i="${i}">${o.h}</button>`).join('')}</div>`;
    } else {
      const list = t.kind === 'list';
      ans.innerHTML = `<div class="ansrow">
        <input id="p-in" class="tin" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false"
          aria-label="Deine Antwort" placeholder="${list ? 'zum Beispiel −5; −2; 0; 3' : 'Ergebnis, zum Beispiel −12'}">
        <div class="preview" id="p-prev" aria-live="polite"></div>
        <div class="keypad" role="group" aria-label="Bildschirmtasten">${keysFor().map(k => `<button type="button" class="key${k === '−' ? ' mi' : ''}" data-key="${k}" aria-label="${k === '⌫' ? 'Löschen' : k === '−' ? 'Minus' : k === ';' ? 'Strichpunkt' : k}">${k}</button>`).join('')}</div>
      </div>`;
      inp = $('#p-in'); prevEl = $('#p-prev');
      inp.addEventListener('input', onInput);
    }
    if (status === 'free' || status === 'hint') {
      if (inp) { inp.value = nice(t.sol); inp.classList.add('good'); onInput(); }
      else ans.querySelector(`.opt[data-i="${t.opts.findIndex(o => o.ok)}"]`).classList.add('good');
      lockInput(); checkBtn.hidden = false; checkBtn.textContent = 'Nächste Aufgabe';
      showFb('ok', `<p class="head">Schon gelöst – ${status === 'free' ? 'ohne Hilfe' : 'mit Tipps'}.</p><p class="lbl">So geht es</p>${T.lineH(t.lines)}`);
    } else if (status === 'shown') {
      if (inp) { inp.value = nice(t.sol); onInput(); }
      lockInput(); checkBtn.hidden = false; checkBtn.textContent = 'Nächste Aufgabe';
      showFb('no', `<p class="head">Hier wurde nach ${MAXW} Fehlversuchen die Lösung angezeigt.</p>`); showSolution();
    } else {
      if (w) { paintHints(); showFb('', `<p>Du hattest hier schon ${w} Fehlversuch${w > 1 ? 'e' : ''}. Deine Tipps stehen unten. Noch ${MAXW - w} Versuch${MAXW - w > 1 ? 'e' : ''} bis zur Lösung.</p>`); }
      if (inp) try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
    }
    paintTries(); paintStats();
  }
  function onInput() {
    inp.classList.remove('bad');
    const v = inp.value.trim();
    if (!v) { prevEl.innerHTML = ''; return; }
    const h = t.kind === 'list' ? T.previewList(v) : T.preview(v);
    prevEl.innerHTML = h ? `So lese ich das: <b>${h}</b>` : 'So lese ich das: …';
  }
  function finish(st) {
    status = st;
    if (cur >= 0) setSlot(s.id, cur, { s: st, w });
    lockInput(); checkBtn.hidden = false; checkBtn.disabled = false; checkBtn.textContent = 'Nächste Aufgabe';
    paintTries(); paintStats();
    try { checkBtn.focus({ preventScroll: true }); } catch (e) { /* egal */ }
  }
  function evaluate(r) {
    if (r.ok) {
      const before = cur >= 0 ? starCount(s.id) : 0;
      finish(w === 0 ? 'free' : 'hint');
      const star = cur >= 0 && starCount(s.id) > before ? `<p class="star">${starSvg(true)} Neuer Stern für „${LV[Math.floor(cur / PER)]}“!</p>` : '';
      showFb('ok', `<p class="head">Richtig!${w === 0 ? ' Ohne Hilfe geschafft.' : ''}</p>${star}<p class="lbl">So geht es</p>${T.lineH(t.lines)}`);
      if (inp) inp.classList.add('good');
      return;
    }
    if (r.syntax || r.near) {
      showFb('no', `<p class="head">${r.near ? 'Fast!' : 'Das kann ich noch nicht lesen.'}</p><p>${r.msg}</p><p class="lbl">Das zählt nicht als Fehlversuch.</p>`);
      if (inp) { inp.classList.add('bad'); inp.focus({ preventScroll: true }); }
      return;
    }
    w++;
    if (w >= MAXW) {
      finish('shown');
      showFb('no', `<p class="head">Das war der ${MAXW}. Fehlversuch.</p><p>${r.msg}</p><p>Hier ist die richtige Lösung. Vergleiche sie genau mit deinem Weg.</p>`);
      if (inp) { inp.value = nice(t.sol); onInput(); }
      showSolution(); return;
    }
    if (cur >= 0) setSlot(s.id, cur, { w });
    paintHints(); paintTries(); paintStats();
    showFb('no', `<p class="head">Noch nicht richtig.</p><p>${r.msg}</p>`
      + (w <= stages.length ? '<p>Unten steht ein neuer Tipp.</p>' : '')
      + (w === MAXW - 1 ? '<p><b>Beim nächsten Fehlversuch wird die Lösung angezeigt.</b></p>' : ''));
    if (inp) { inp.classList.add('bad'); inp.focus({ preventScroll: true }); }
  }
  function goNext() {
    if (!counted) { cur = -1; openTask(); return; }
    const n = firstOpen(s.id);
    if (cur >= 0 && n >= 0) { let k = cur + 1; while (k < SLOTS && isDone(slot(s.id, k))) k++; cur = k < SLOTS ? k : n; }
    else cur = n;
    openTask();
    if (cur < 0 && firstOpen(s.id) < 0) showFb('ok', '<p class="head">Alle 9 Aufgaben dieser Station sind bearbeitet! 🎉</p><p>Hier kannst du mit Extra-Aufgaben weiterüben – sie zählen nicht zum Fortschritt.</p>');
  }
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (status) { goNext(); return; }
    if (!inp) return;
    const v = inp.value.trim();
    if (!v) { showFb('', '<p>Gib zuerst eine Antwort ein.</p>'); return; }
    evaluate(T.check(t, v));
  });
  ans.addEventListener('click', e => {
    const o = e.target.closest('.opt');
    if (o && !status) {
      if (o.disabled) return;
      const r = T.check(t, +o.dataset.i);
      o.classList.add(r.ok ? 'good' : 'bad');
      if (!r.ok) o.disabled = true;
      evaluate(r);
      return;
    }
    const k = e.target.closest('[data-key]');
    if (!k || !inp || status) return;
    const key = k.dataset.key, a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a;
    if (key === '⌫') {
      if (a !== b) inp.setRangeText('', a, b, 'end');
      else if (a > 0) inp.setRangeText('', a - 1, a, 'end');
    } else inp.setRangeText(key === ';' ? '; ' : key, a, b, 'end');
    onInput();
    try { inp.focus({ preventScroll: true }); } catch (err) { inp.focus(); }
  });
  solBtn.addEventListener('click', showSolution);
  $('#p-next').addEventListener('click', goNext);
  if (counted) $('#p-slots').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; cur = +b.dataset.i; openTask(); });
  else $('#p-level').addEventListener('click', e => {
    const b = e.target.closest('[data-l]'); if (!b) return;
    extraLvl = +b.dataset.l; store.set('gz-lvl-' + s.id, extraLvl);
    $('#p-level').querySelectorAll('[data-l]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    openTask();
  });
  if (counted && firstOpen(s.id) < 0) cur = -1;
  openTask();
  TLUI.practice = {
    task: () => t, cur: () => cur, status: () => status, wrong: () => w,
    open(i) { cur = i; openTask(); },
    answer(v) { inp.value = v; onInput(); form.requestSubmit(); return { cls: fb.className, text: fb.textContent }; },
    choose(i) { $(`.opt[data-i="${i}"]`).click(); return { cls: fb.className, text: fb.textContent }; },
    next: goNext,
    hints: () => hintsEl.children.length,
    sol: () => solbox.hidden ? '' : solbox.textContent,
    preview: () => (prevEl ? prevEl.innerHTML : ''),
  };
}

// ---------- Navigation: letzte Stelle merken ----------
function route() {
  const m = /^#s(\d+)(-ueben)?$/.exec(location.hash);
  if (m && T.byId(+m[1])) { station(+m[1], m[2] ? 'ueben' : 'lernen'); store.set(POS, location.hash); }
  else { home(); if (location.hash === '#start') store.set(POS, '#start'); }
  window.scrollTo(0, 0);
}
TLUI.route = route;
TLUI.reload = () => { data = loadData(); route(); };
addEventListener('hashchange', route);
if (!location.hash) { const p = store.get(POS, null); if (p && /^#s\d+(-ueben)?$/.test(p)) history.replaceState(null, '', p); }
try { const th = store.get('gz-theme', null); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* egal */ }
route();

$('#theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  store.set('gz-theme', root.dataset.theme);
});
})();
</script>
