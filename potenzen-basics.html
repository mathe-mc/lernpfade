<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernpfad Potenzrechnung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Gleiche Familie wie Terme- und Ganze-Zahlen-Lernpfad: Papier, Tinte, Petrol (Bedienung), Bernstein (Hervorhebung).
   Bruchstreifen und Kreise in drei Farben (--ca, --cb, --cc); Blau/Himbeere wie bei den ganzen Zahlen für Vorzeichen. */
:root {
  --bg: #f4f1ea; --dot: rgba(90, 75, 40, .13); --card: #fffdf9; --card-2: #f6f2e9;
  --ink: #1e2430; --ink-2: #5b606c; --ink-3: #8c909a; --line: #e6dfd1; --line-2: #cbc1ae;
  --pri: #0e6b6b; --pri-ink: #ffffff; --pri-soft: #dcefeb;
  --red: #d1382c; --hop: #ffc02e; --hop-ink: #2e2200; --hop-soft: #fff0c2; --hop-strong: #a86a00;
  --ok: #1b7a45; --ok-soft: #e0f3e6; --warn: #a3560a; --warn-soft: #fff1de;
  --pos: #2c5fc0; --pos-soft: #e1e9fb; --neg: #c22f5f; --neg-soft: #fbe3ec;
  --ca: #5b86d8; --ca-soft: #dbe5f8; --cb: #f0b23a; --cb-soft: #fdecc5; --cc: #8a68d6; --cut: #e9a0a0;
  --k1: #0e6b6b; --k1s: #dcefeb; --k2: #a86a00; --k2s: #fff0c2; --k3: #6a4bc4; --k3s: #ece6fb;
  --shadow: 0 1px 2px rgba(40, 32, 15, .05), 0 8px 24px rgba(40, 32, 15, .06);
  --f: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --ease: cubic-bezier(.5, 0, .25, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161d1c; --dot: rgba(220, 235, 225, .07); --card: #1e2826; --card-2: #25302e;
    --ink: #edf2ee; --ink-2: #b3c0ba; --ink-3: #82918b; --line: #34433f; --line-2: #4f625c;
    --pri: #5cc6bc; --pri-ink: #0a1d1b; --pri-soft: #1f3b38; --red: #ff7b6b;
    --hop: #f2b62c; --hop-ink: #1d1600; --hop-soft: rgba(242, 182, 44, .17); --hop-strong: #ffcb55;
    --ok: #6fd69a; --ok-soft: #1b3326; --warn: #ffbf6e; --warn-soft: #3a2d18;
    --pos: #8fb2ff; --pos-soft: rgba(143, 178, 255, .16); --neg: #ff8fb8; --neg-soft: rgba(255, 143, 184, .15);
    --ca: #6f9bf0; --ca-soft: rgba(111, 155, 240, .22); --cb: #e0a530; --cb-soft: rgba(224, 165, 48, .22); --cc: #a68cf0; --cut: #8a4a4a;
    --k1: #5cc6bc; --k1s: #1f3b38; --k2: #ffcb55; --k2s: rgba(242, 182, 44, .17); --k3: #b9a4ff; --k3s: rgba(185, 164, 255, .16);
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161d1c; --dot: rgba(220, 235, 225, .07); --card: #1e2826; --card-2: #25302e;
  --ink: #edf2ee; --ink-2: #b3c0ba; --ink-3: #82918b; --line: #34433f; --line-2: #4f625c;
  --pri: #5cc6bc; --pri-ink: #0a1d1b; --pri-soft: #1f3b38; --red: #ff7b6b;
  --hop: #f2b62c; --hop-ink: #1d1600; --hop-soft: rgba(242, 182, 44, .17); --hop-strong: #ffcb55;
  --ok: #6fd69a; --ok-soft: #1b3326; --warn: #ffbf6e; --warn-soft: #3a2d18;
  --pos: #8fb2ff; --pos-soft: rgba(143, 178, 255, .16); --neg: #ff8fb8; --neg-soft: rgba(255, 143, 184, .15);
  --ca: #6f9bf0; --ca-soft: rgba(111, 155, 240, .22); --cb: #e0a530; --cb-soft: rgba(224, 165, 48, .22); --cc: #a68cf0; --cut: #8a4a4a;
  --k1: #5cc6bc; --k1s: #1f3b38; --k2: #ffcb55; --k2s: rgba(242, 182, 44, .17); --k3: #b9a4ff; --k3s: rgba(185, 164, 255, .16);
  --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .2);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.4px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 16px/1.5 var(--f);
}
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: clamp(1.25rem, 3vw, 1.6rem); }
h2 { font-size: clamp(1.3rem, 3.4vw, 1.75rem); }
h3 { font-size: 1.12rem; margin-bottom: 10px; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 0; padding-left: 1.25em; display: grid; gap: 6px; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; }
[hidden] { display: none !important; }
sup { font-size: .62em; vertical-align: .75em; line-height: 0; margin-left: .03em; font-weight: 700; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .86em; line-height: 1.12; margin: 0 .1em; }
.fr > span { padding: 0 .22em; white-space: nowrap; }
.fr > span + span { border-top: 2px solid currentColor; }
.fr .fr { font-size: .9em; }
.mx { display: inline-block; width: .12em; }
.fig { display: flex; justify-content: center; }
.bars { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.bar { display: grid; width: min(300px, 64vw); height: 40px; border: 2.5px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--card); }
.bar i { border-right: 1.5px solid var(--line-2); transition: background-color .3s; }
.bar i:last-child { border-right: 0; }
.bar i.m { border-right: 3px solid var(--ink); }
.bar i.a { background: var(--ca); } .bar i.b { background: var(--cb); } .bar i.c { background: var(--cc); }
.bar i.x { background: repeating-linear-gradient(135deg, var(--cut) 0 5px, var(--card) 5px 10px); }
.barrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.barl { min-width: 2.6em; text-align: right; font-weight: 600; font-size: 1.3rem; }
.pie { width: 140px; height: 140px; flex: none; }
.pie path, .pie circle { stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.pie .a { fill: var(--ca); } .pie .b { fill: var(--cb); } .pie .c { fill: var(--cc); } .pie .e { fill: var(--card); }
.dots { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 560px; }
.dg { display: grid; gap: 5px; padding: 8px; border: 2px dashed var(--line-2); border-radius: 10px; transition: border-color .3s; }
.dg i { width: 14px; height: 14px; border-radius: 50%; background: var(--line-2); }
.dg.on { border-color: var(--hop-strong); border-style: solid; background: var(--hop-soft); }
.dg.on i { background: var(--ca); }
.area { display: grid; width: min(240px, 62vw); aspect-ratio: 1; max-width: 100%; border: 2.5px solid var(--ink); background: var(--card); }
.area i { border: 1px solid var(--line-2); transition: background-color .3s; }
.area i.x { background: var(--ca-soft); } .area i.y { background: var(--cb-soft); } .area i.xy { background: var(--cc); } .area i.f { opacity: .5; }
.anat { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 24px; }
.anat-r { display: grid; gap: 8px; justify-items: center; }
.decs { display: grid; gap: 10px; }
.dec { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dec .dl { font: 600 1.3rem/1 var(--f); min-width: 2.5ch; text-align: right; }
.dec .eqs { font-weight: 600; color: var(--ink-3); }
.dec .row { justify-content: flex-start; }
.fc.com { background: var(--hop-soft); border-color: var(--hop-strong); }
.nl g.sq line { stroke: var(--c, var(--ink)); stroke-width: 1.8; }
.nl g.sq text { font-size: 16px; fill: var(--c, var(--ink)); }
.nl g.nl-fl text { fill: var(--ink-2); font-weight: 500; }
.nl g.nl-fl line { stroke: var(--ink-2); }
.box.s { width: .75em; height: .85em; border-width: 2px; border-radius: 4px; margin: 0 .05em; vertical-align: baseline; }
sup sup { font-size: .8em; vertical-align: .6em; }
.sqg { --cell: 18px; display: grid; gap: 3px; }
.sqg i { width: var(--cell); height: var(--cell); border-radius: 4px; background: var(--ca); }
.sqg.mini { --cell: 11px; gap: 2px; }
.sqg.mini i { border-radius: 2px; }
.cube { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
.lay { display: grid; gap: 6px; justify-items: center; }
.cube .lay:nth-child(2) .sqg i { background: var(--cb); }
.cube .lay:nth-child(3) .sqg i { background: var(--cc); }
.frc { display: inline-grid; gap: 10px; justify-items: center; }
.frc .fl { display: block; width: 100%; border-top: 3px solid var(--ink); }
.gb { display: grid; gap: 8px; width: min(560px, 100%); }
.gb > div { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) 5.5em; align-items: center; gap: 10px; }
.gbl { text-align: right; font-weight: 600; }
.gbt { display: block; min-width: 0; }
.gbt b { display: block; height: 18px; border-radius: 4px; background: var(--ca); transition: width .4s var(--ease); }
.gbt b.neg { background: var(--neg); }
.gv { font-weight: 600; font-variant-numeric: tabular-nums; }
.grp.k2 { --kb: var(--k2); }
.fc.k2 { --kb: var(--k2); --ks: var(--k2s); }

.k1 { --kb: var(--k1); --ks: var(--k1s); } .k2 { --kb: var(--k2); --ks: var(--k2s); } .k3 { --kb: var(--k3); --ks: var(--k3s); }
.pos { --kb: var(--pos); --ks: var(--pos-soft); } .neg { --kb: var(--neg); --ks: var(--neg-soft); }
.nv { color: var(--neg); } .pv { color: var(--pos); }
.hl { background: var(--hop); color: var(--hop-ink); border-radius: 6px; padding: 0 .18em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.box { display: inline-block; width: 1.05em; height: 1.1em; border: 2.5px dashed var(--ink-3); border-radius: 7px; vertical-align: -.15em; margin: 0 .15em; }

/* ---------- Kopf ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo {
  width: 46px; height: 46px; flex: none; border-radius: 13px; background: var(--pri); color: var(--pri-ink);
  display: flex; align-items: center; justify-content: center; font: 700 19px/1 var(--f); letter-spacing: -.02em;
}
.logo i { font-style: normal; color: var(--hop); }

.seg { display: inline-flex; gap: 3px; padding: 3px; background: var(--card-2); border: 1px solid var(--line); border-radius: 13px; }
.seg button, .seg a {
  border: 0; background: transparent; cursor: pointer; font-weight: 600; color: var(--ink-2); text-decoration: none;
  padding: 7px 16px; min-height: 42px; border-radius: 10px; line-height: 1.15;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
}
.seg button small { font-weight: 400; font-size: .74rem; opacity: .85; }
.seg button:hover, .seg a:hover { background: var(--pri-soft); color: var(--ink); }
.seg button[aria-pressed="true"], .seg a[aria-current="page"] { background: var(--pri); color: var(--pri-ink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
  border: 1.5px solid var(--line-2); background: var(--card); color: var(--ink); font-weight: 600;
}
.btn:hover { border-color: var(--pri); }
.btn.primary { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .4; cursor: default; filter: none; border-color: var(--line-2); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.icon { padding: 8px 11px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 22px; min-width: 0; }
.view { display: grid; gap: 16px; }
.view > * { min-width: 0; }
.lbl { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 0; }

/* ---------- Lernpfad (Startseite) ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px 28px; align-items: center; }
.hero p { max-width: 62ch; color: var(--ink-2); }
.hero h2 { margin: 4px 0 10px; }
.herofx { display: grid; gap: 8px; justify-items: center; padding: 14px; border-radius: 14px; background: var(--card-2); border: 1px dashed var(--line-2); min-width: 0; overflow: hidden; }
.herofx .eqbig { font-size: 1.3rem; margin: 0; }
.herofx .lbl { justify-self: start; }
.herofx .nl { min-width: 0; }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; position: relative; }
.path::before { content: ""; position: absolute; left: 33px; top: 26px; bottom: 26px; border-left: 3px dashed var(--line-2); }
.stn {
  position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; align-items: center; gap: 6px 16px;
  padding: 12px 16px 12px 12px; text-decoration: none; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  transition: border-color .2s, transform .2s;
}
.stn:hover { border-color: var(--pri); transform: translateX(3px); }
.num {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.1rem;
  background: var(--card); border: 3px solid var(--pri); color: var(--pri); position: relative; z-index: 1; flex: none;
}
.stn.done .num { background: var(--pri); color: var(--pri-ink); }
.stn.goal .num { border-color: var(--hop-strong); color: var(--hop-strong); }
.st-t { display: grid; min-width: 0; }
.st-t b { font-size: 1.05rem; }
.st-t small { color: var(--ink-2); font-size: .86rem; }
.st-ex { font-weight: 600; color: var(--ink-2); white-space: nowrap; font-size: .98rem; }
.st-ex small { font-weight: 500; }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 20px; height: 20px; }
.stars .on { fill: var(--hop); stroke: var(--hop-strong); }
.stars .off { fill: none; stroke: var(--line-2); }

/* ---------- Station ---------- */
.shead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px; }
.stitle { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.intro p, .intro li { max-width: 68ch; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.merke { background: var(--pri-soft); border-color: var(--pri); }
.falle { background: var(--warn-soft); border-color: var(--warn); }
.merke h3 { color: var(--pri); }
.falle h3 { color: var(--warn); }
.nextrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; }
.figwrap { overflow-x: auto; margin: 6px 0 12px; padding: 8px 0; }
.figwrap .nl { margin-top: -54px; }

.dictwrap { overflow-x: auto; margin: 4px 0 10px; }
.dict { border-collapse: collapse; width: 100%; min-width: 440px; font-size: .95rem; }
.dict th { text-align: left; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 6px 10px; border-bottom: 2px solid var(--line); }
.dict td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dict td.z { font-weight: 700; font-size: 1.25rem; color: var(--pri); text-align: center; }
.dict td:last-child { white-space: nowrap; font-weight: 600; }

/* Vorzeichen-Regeln */
.vz { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 460px; width: 100%; margin: 6px 0 10px; }
.vz > span { padding: 8px 10px; border-radius: 10px; background: var(--card); border: 1.5px solid var(--line); font-weight: 600; text-align: center; white-space: nowrap; font-size: 1.05rem; }
.vz > span.p { border-color: var(--pos); } .vz > span.n { border-color: var(--neg); }
.vz > span.on { background: var(--hop-soft); border-color: var(--hop-strong); }
.vz b { font-size: 1.15em; }
.ladder { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 12px; }
.ladder span { padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--line-2); font-weight: 600; }
.ladder i { font-style: normal; color: var(--ink-3); font-weight: 700; }

/* ---------- Zahlengerade (SVG) ---------- */
.nl { display: block; width: 100%; min-width: 480px; max-width: 760px; height: auto; margin: 0 auto; }
.nl text { font: 600 18px var(--f); fill: var(--ink); }
.nl text.nl-l { fill: var(--ink-2); font-weight: 500; font-size: 17px; }
.nl text.nl-l.n { fill: var(--neg); }
.nl text.nl-l.z { fill: var(--ink); font-weight: 700; }
.nl-ax { stroke: var(--ink); stroke-width: 2.5; }
.nl-ah { fill: var(--ink); }
.nl-t { stroke: var(--ink-2); stroke-width: 1.6; }
.nl-t.z { stroke: var(--ink); stroke-width: 3; }
.nl-nz { fill: var(--neg-soft); } .nl-pz { fill: var(--pos-soft); }
.nl .pos { --c: var(--pos); } .nl .neg { --c: var(--neg); } .nl .hop { --c: var(--hop-strong); } .nl .ink { --c: var(--ink); }
.nl-j { fill: none; stroke: var(--c, var(--ink)); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 1; }
.nl-jh { fill: var(--c, var(--ink)); }
.nl text.nl-jl { fill: var(--c, var(--ink)); font-size: 17px; }
.nl-sp { fill: none; stroke: var(--c, var(--ink-2)); stroke-width: 2.4; }
.nl text.nl-sl { fill: var(--c, var(--ink-2)); font-size: 17px; }
.nl-p circle { fill: var(--c, var(--hop)); stroke: var(--card); stroke-width: 3; }
.nl text.nl-pl { fill: var(--c, var(--ink)); font-size: 20px; font-weight: 700; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
.nl-j.new { animation: draw .6s var(--ease); }
.nl .new-h { animation: pop .25s .5s backwards; }

/* ---------- Erklär-Bühne ---------- */
.exhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip {
  border: 1.5px solid var(--line-2); background: var(--card); border-radius: 999px; cursor: pointer;
  padding: 4px 13px; min-height: 38px; color: var(--ink); font-weight: 500;
}
.chip:hover { border-color: var(--pri); }
.chip[aria-pressed="true"] { background: var(--pri); border-color: var(--pri); color: var(--pri-ink); }
.stagebox {
  margin-top: 16px; min-height: 240px; padding: 18px 10px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line);
  display: grid; align-content: center; justify-items: center; gap: 14px; overflow-x: auto; overflow-y: hidden;
}
.stagebox > * { max-width: 100%; }
.stagebox > .nl { max-width: 760px; }
.cap { margin: 14px 0 0; min-height: 3em; font-size: 1.02rem; max-width: 72ch; }
.cap b { background: var(--hop); color: var(--hop-ink); padding: 0 6px; border-radius: 6px; }
.player { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; margin-top: 14px; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; min-width: 0; }
.cv {
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink-3); cursor: pointer;
  border-radius: 10px; padding: 3px 10px; min-height: 36px; font-weight: 600; white-space: nowrap; font-size: .9rem;
}
.cv.past { color: var(--ink-2); }
.cv[aria-current="step"] { color: var(--ink); border-color: var(--pri); background: var(--pri-soft); }
.ar { color: var(--ink-3); font-weight: 600; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.eqbig { font: 600 clamp(1.45rem, 4.6vw, 2.05rem)/1.35 var(--f); text-align: center; margin: 0; }
.eqbig.sm { font-size: clamp(1.2rem, 3.8vw, 1.6rem); }
.eqbig.dim { color: var(--ink-3); }

// ---------- Selbsttest (Node: TL.runTests()) ----------
function runTests(n = 150) {
  const fails = [];
  const ok = (c, m) => { if (!c) fails.push(m); };
  const V = s => qS(val(parse(s)));
  const cases = [['2^5', '32'], ['-3^2', '-9'], ['(-3)^2', '9'], ['(2/3)^2', '4/9'], ['2/3^2', '2/9'], ['(2^3)^2', '64'], ['2³', '8'], ['5^0', '1'], ['100 000', '100000'], ['3.500.000', '3500000'], ['3,5 * 10^6', '3500000'], ['(1 1/2)^2', '9/4']];
  for (const [a, b] of cases) ok(V(a) === b, `Wert ${a} → ${V(a)} statt ${b}`);
  for (const bad of ['', '2^', '^3', '2^x', '(2', '2 3', '0^-2', '10^(-3']) { try { val(parse(bad)); fails.push('kein Fehler bei: ' + bad); } catch (e) { ok(e.user, 'Fehlerart: ' + bad + ' ' + e.message); } }
  const tp = mul4(Q(2), [3, 4]);
  ok(check(tp, '2^7').ok && check(tp, '2⁷').ok, 'Potenz richtig'); ok(check(tp, '128').near, 'Wert statt Potenz'); ok(check(tp, '2^3*2^4').near, 'nicht zusammengefasst');
  ok(/multipliziert/.test(check(tp, '2^12').msg), 'Falle 2^12'); ok(/Grundzahl bleibt/.test(check(tp, '4^7').msg), 'Falle 4^7'); ok(check(tp, '4^3*2').near === true || !check(tp, '4^3*2').ok, '4^3*2');
  const tn = mul4(Q(-2), [3, 4]); ok(check(tn, '(-2)^7').ok && check(tn, '-2^7').near && !check(tn, '2^7').ok, 'neg Klammer');
  ok(V('10^-3') === '1/1000' && V('10^(-3)') === '1/1000' && V('10⁻³') === '1/1000' && V('4,2*10^-4') === '21/50000', 'negative Hochzahlen');
  const td = decOf10(3); ok(check(td, '0,001').ok && check(td, '0.001').ok && check(td, '1/1000').near && /nicht negativ/.test(check(td, '-1000').msg), 'dec form');
  const tr = rule10('div'); ok(check(tr, tr.sol).ok, 'rule10');
  const t6 = pp6(Q(-2), 3, 2); ok(check(t6, '(-2)^6').ok && check(t6, '2^6').ok, 'pp6 gerade');
  const tb = pp6(Q(7), 5, 4); ok(check(tb, '7^20').ok && check(tb, '(7^5)^4').near && /multipliziert/.test(check(tb, '7^9').msg), 'große Potenz');
  ok(check(tb, '7^21').ok === false, 'falsche Hochzahl');
  for (const s of STATIONS.concat([MIX])) for (const l of [1, 2, 3]) for (let i = 0; i < n; i++) {
    let t;
    try { t = s.gen(l); } catch (e) { fails.push(`gen ${s.id}/${l}: ${e.stack}`); break; }
    const tag = `S${t.st} L${l} ${String(t.q).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 70)}`;
    if (t.kind === 'mc') {
      const i0 = t.opts.findIndex(o => o.ok);
      ok(i0 >= 0 && t.opts.filter(o => o.ok).length === 1 && t.opts.length >= 2, 'mc ' + tag);
      ok(check(t, i0).ok && t.opts.every((o, k) => k === i0 || !check(t, k).ok), 'mc prüfen ' + tag);
    } else {
      const r = check(t, t.sol);
      ok(r.ok, `Lösung nicht akzeptiert: ${tag} / ${t.sol} → ${r.msg}`);
      if (t.form === 'pow') {
        for (const tr of t.ptraps) { const rr = check(t, pS(tr.b, tr.e)); ok(!rr.ok, `Falle akzeptiert: ${tag} / ${pS(tr.b, tr.e)}`); }
        const v = tq(() => qpow(t.want.b, t.want.e));
        if (v && t.want.e > 1) ok(check(t, qS(v)).near, 'Wert nicht near: ' + tag);
      } else {
        ok((t.form === 'dec' ? t.val[1] <= 1e11 : t.val[1] <= 100000) && abs(t.val[0]) <= 1e10, 'zu groß: ' + tag + ' ' + t.sol);
        for (const tr of t.traps) ok(!check(t, qS(tr.val)).ok, `Falle akzeptiert: ${tag} / ${qS(tr.val)}`);
      }
    }
    ok(t.lines.length >= 1, 'Lösungsweg ' + tag);
    ok(typeof s.hint(t) === 'string', 'Tipp ' + tag);
  }
  for (const s of STATIONS) {
    for (const ex of s.examples()) {
      try { const st = s.explore(ex.x); ok(st.length >= 2 && st.every(x => x.h && x.cap && x.lab), 'explore ' + s.id); }
      catch (e) { fails.push(`explore ${s.id}: ${e.stack}`); }
    }
    try { s.bsp().forEach(t => ok(t.lines.length >= 2 && check(t, t.sol).ok, 'bsp ' + s.id)); } catch (e) { fails.push(`bsp ${s.id}: ${e.stack}`); }
  }
  return fails;
}

}
const firstOpen = id => { for (let i = 0; i < SLOTS; i++) if (!isDone(slot(id, i))) return i; return -1; };
// Knopf, der erst beim zweiten Klick auslöst (Dialogfenster gehen nicht überall)
function twoClick(b, label, ask, fn) {
  b.onclick = () => {
    if (b.dataset.s !== '1') { b.dataset.s = '1'; b.textContent = ask; setTimeout(() => { if (b.isConnected) { b.dataset.s = ''; b.textContent = label; } }, 4000); return; }

// ---------- Bewegung: Elemente mit gleichem data-k gleiten an ihren neuen Platz ----------
function morph(el, html) {
  const old = new Map();
  const anim = !reduce && typeof el.animate === 'function';
  if (anim) el.querySelectorAll('[data-k]').forEach(n => old.set(n.dataset.k, n.getBoundingClientRect()));
  el.innerHTML = html;
  if (!anim) return;
  if (!old.size) { el.animate([{ opacity: 0.35 }, { opacity: 1 }], { duration: 250 }); return; }
  el.querySelectorAll('[data-k]').forEach(n => {
    const o = old.get(n.dataset.k), r = n.getBoundingClientRect();
    if (o) {
      const dx = o.left - r.left, dy = o.top - r.top;
      if (Math.abs(dx) + Math.abs(dy) > 1) n.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 650, easing: 'cubic-bezier(.5,0,.25,1)' });
    } else n.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'ease-out' });
  });
}

function explorer(s) {
  const items = s.examples();
  let cur = 0, step = 0, steps = [];
  const chips = $('#ex-chips'), stage = $('#ex-stage'), cap = $('#ex-cap'), chain = $('#ex-chain');
  const prev = $('#ex-prev'), next = $('#ex-next');
  chips.innerHTML = items.map((it, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="${i === 0}">${it.label}</button>`).join('');
  function draw() {
    morph(stage, steps[step].h);
    cap.innerHTML = steps[step].cap;
    chain.innerHTML = steps.map((x, i) => (i ? '<span class="ar" aria-hidden="true">→</span>' : '')
      + `<button type="button" class="cv${i < step ? ' past' : ''}" data-s="${i}"${i === step ? ' aria-current="step"' : ''}>${x.lab}</button>`).join('');
    prev.disabled = step === 0;
    next.textContent = step === steps.length - 1 ? 'Nochmal' : 'Weiter';
  }
  function load(i) {
    cur = i; steps = s.explore(items[i].x); step = 0; draw();
    chips.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === i)));
  }
  chips.onclick = e => { const b = e.target.closest('[data-i]'); if (b) load(+b.dataset.i); };
  chain.onclick = e => { const b = e.target.closest('[data-s]'); if (b) { step = +b.dataset.s; draw(); } };
  prev.onclick = () => { if (step > 0) { step--; draw(); } };
  next.onclick = () => { step = step === steps.length - 1 ? 0 : step + 1; draw(); };
  load(0);
  TLUI.explorer = { steps: () => steps.length, step: () => step, next: () => next.click(), load, count: items.length };
}

    paintHints(); paintTries(); paintStats();
    showFb('no', `<p class="head">Noch nicht richtig.</p><p>${r.msg}</p>`
      + (w <= stages.length ? '<p>Unten steht ein neuer Tipp.</p>' : '')
      + (w === MAXW - 1 ? '<p><b>Beim nächsten Fehlversuch wird die Lösung angezeigt.</b></p>' : ''));
    if (inp) { inp.classList.add('bad'); inp.focus({ preventScroll: true }); }
  }
  function goNext() {
    if (!counted) { cur = -1; openTask(); return; }
    const n = firstOpen(s.id);
    if (cur >= 0 && n >= 0) { let k = cur + 1; while (k < SLOTS && isDone(slot(s.id, k))) k++; cur = k < SLOTS ? k : n; }
    else cur = n;
    openTask();
    if (cur < 0 && firstOpen(s.id) < 0) showFb('ok', '<p class="head">Alle 9 Aufgaben dieser Station sind bearbeitet! 🎉</p><p>Hier kannst du mit Extra-Aufgaben weiterüben – sie zählen nicht zum Fortschritt.</p>');
  }
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (status) { goNext(); return; }
    if (!inp) return;
    const v = inp.value.trim();
    if (!v) { showFb('', '<p>Gib zuerst eine Antwort ein.</p>'); return; }
    evaluate(T.check(t, v));
  });
  ans.addEventListener('click', e => {
    const o = e.target.closest('.opt');
    if (o && !status) {
      if (o.disabled) return;
      const r = T.check(t, +o.dataset.i);
      o.classList.add(r.ok ? 'good' : 'bad');
      if (!r.ok) o.disabled = true;
      evaluate(r);
      return;
    }
    const k = e.target.closest('[data-key]');
    if (!k || !inp || status) return;
    const key = k.dataset.key, a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a;
    if (key === '⌫') {
      if (a !== b) inp.setRangeText('', a, b, 'end');
      else if (a > 0) inp.setRangeText('', a - 1, a, 'end');
    } else inp.setRangeText(key === ';' ? '; ' : key === '␣' ? ' ' : key, a, b, 'end');
    onInput();
    try { inp.focus({ preventScroll: true }); } catch (err) { inp.focus(); }
  });
  solBtn.addEventListener('click', showSolution);
  $('#p-next').addEventListener('click', goNext);
  if (counted) $('#p-slots').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; cur = +b.dataset.i; openTask(); });
  else $('#p-level').addEventListener('click', e => {
    const b = e.target.closest('[data-l]'); if (!b) return;
    extraLvl = +b.dataset.l; store.set('pw-lvl-' + s.id, extraLvl);
    $('#p-level').querySelectorAll('[data-l]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    openTask();
  });
  if (counted && firstOpen(s.id) < 0) cur = -1;
  openTask();
  TLUI.practice = {
    task: () => t, cur: () => cur, status: () => status, wrong: () => w,
    open(i) { cur = i; openTask(); },
    answer(v) { inp.value = v; onInput(); form.requestSubmit(); return { cls: fb.className, text: fb.textContent }; },
    choose(i) { $(`.opt[data-i="${i}"]`).click(); return { cls: fb.className, text: fb.textContent }; },
    next: goNext,
    hints: () => hintsEl.children.length,
    sol: () => solbox.hidden ? '' : solbox.textContent,
    preview: () => (prevEl ? prevEl.innerHTML : ''),
  };
}

// ---------- Navigation: letzte Stelle merken ----------
function route() {
  const m = /^#s(\d+)(-ueben)?$/.exec(location.hash);
  if (m && T.byId(+m[1])) { station(+m[1], m[2] ? 'ueben' : 'lernen'); store.set(POS, location.hash); }
  else { home(); if (location.hash === '#start') store.set(POS, '#start'); }
  window.scrollTo(0, 0);
}
TLUI.route = route;
TLUI.reload = () => { data = loadData(); route(); };
addEventListener('hashchange', route);
if (!location.hash) { const p = store.get(POS, null); if (p && /^#s\d+(-ueben)?$/.test(p)) history.replaceState(null, '', p); }
try { const th = store.get('pw-theme', null); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* egal */ }
route();

$('#theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  store.set('pw-theme', root.dataset.theme);
});
})();
</script>
